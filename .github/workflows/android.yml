name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Job-level so the steps below can check whether the upload key is configured.
      KEYSTORE_BASE64: ${{ secrets.SNAPSTACK_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner already has the Android SDK; this accepts its licenses. The old "tools"
      # package no longer exists, so only platform-tools is requested.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode upload key (when configured)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SNAPSTACK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APKs
        env:
          SNAPSTACK_KEYSTORE_PASSWORD: ${{ secrets.SNAPSTACK_KEYSTORE_PASSWORD }}
          SNAPSTACK_KEY_ALIAS: ${{ secrets.SNAPSTACK_KEY_ALIAS }}
          SNAPSTACK_KEY_PASSWORD: ${{ secrets.SNAPSTACK_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: tcg-investment-portfolio-apks
          path: app/build/outputs/apk/release/*.apk

      # Google Play bundle, signed with your upload key (see docs/play-store/RELEASE.md).
      - name: Build Play bundle
        if: env.KEYSTORE_BASE64 != ''
        env:
          SNAPSTACK_KEYSTORE_PASSWORD: ${{ secrets.SNAPSTACK_KEYSTORE_PASSWORD }}
          SNAPSTACK_KEY_ALIAS: ${{ secrets.SNAPSTACK_KEY_ALIAS }}
          SNAPSTACK_KEY_PASSWORD: ${{ secrets.SNAPSTACK_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_BASE64 != ''
        with:
          name: tcg-investment-portfolio-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
